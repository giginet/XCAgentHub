name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: macos-latest
    env:
      # Pinned: macos-latest defaults to 26.6, and a toolchain that moves on
      # its own turns an unrelated day into a debugging session.
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Run tests
        run: |
          xcodebuild test \
            -project XCAgentHub.xcodeproj \
            -scheme XCAgentHub \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
